<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f9fa"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <radialGradient id="dotGlow"><stop offset="0" stop-color="#1a6bff" stop-opacity="0.3"/><stop offset="1" stop-color="#1a6bff" stop-opacity="0"/></radialGradient>
  </defs>
  
  <rect width="940" height="400" fill="url(#bg3)"/>
  
  <!-- Subtle background circles -->
  <g opacity="0.03">
    <circle cx="200" cy="200" r="180" fill="#1a6bff"/>
    <circle cx="600" cy="100" r="120" fill="#ff6b35"/>
  </g>
  
  <!-- Connecting arc -->
  <path d="M780,70 Q870,200 520,370" fill="none" stroke="#1a6bff" stroke-width="1" opacity="0.15" stroke-dasharray="4,6"/>
  
  <!-- 10 dots with glow -->
  <g opacity="0.3">
    <circle cx="780" cy="70" r="16" fill="#1a6bff"/><circle cx="780" cy="70" r="30" fill="url(#dotGlow)"/>
    <circle cx="835" cy="110" r="16" fill="#ff6b35"/><circle cx="835" cy="110" r="30" fill="url(#dotGlow)"/>
    <circle cx="870" cy="165" r="16" fill="#2e7d32"/><circle cx="870" cy="165" r="30" fill="url(#dotGlow)"/>
    <circle cx="880" cy="225" r="16" fill="#5b6abf"/><circle cx="880" cy="225" r="30" fill="url(#dotGlow)"/>
    <circle cx="860" cy="285" r="16" fill="#e53935"/><circle cx="860" cy="285" r="30" fill="url(#dotGlow)"/>
    <circle cx="815" cy="335" r="16" fill="#1a6bff"/><circle cx="815" cy="335" r="30" fill="url(#dotGlow)"/>
    <circle cx="750" cy="365" r="16" fill="#ff6b35"/><circle cx="750" cy="365" r="30" fill="url(#dotGlow)"/>
    <circle cx="675" cy="380" r="16" fill="#2e7d32"/><circle cx="675" cy="380" r="30" fill="url(#dotGlow)"/>
    <circle cx="595" cy="385" r="16" fill="#5b6abf"/><circle cx="595" cy="385" r="30" fill="url(#dotGlow)"/>
    <circle cx="520" cy="370" r="16" fill="#e53935"/><circle cx="520" cy="370" r="30" fill="url(#dotGlow)"/>
  </g>
  
  <!-- Badge -->
  <rect x="30" y="25" width="100" height="26" rx="13" fill="#1a6bff"/>
  <text x="80" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#fff">深度连载</text>
  
  <!-- Title -->
  <text x="50" y="175" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="44" font-weight="bold" fill="#1e293b">80%的时间花在哪？</text>
  <text x="50" y="240" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" fill="#1a6bff" font-weight="bold">10个场景告诉你答案</text>
  
  <rect x="50" y="258" width="60" height="3" rx="1.5" fill="#1a6bff"/>
  
  <!-- Brand -->
  <text x="910" y="370" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#94a3b8" opacity="0.7">清源智界 · 獴探</text>
</svg>
