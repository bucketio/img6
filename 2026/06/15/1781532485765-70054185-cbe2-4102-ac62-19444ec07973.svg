<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">系统瓶颈不是只有硬盘</title>
  <desc id="desc">日常流畅度由硬盘、CPU、内存、软件和网络共同决定</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">电脑卡不卡，不是硬盘一个人决定</text>
  <circle cx="450" cy="220" r="70" fill="#0f766e"/>
  <text x="450" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">日常</text>
  <text x="450" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">体感</text>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <rect x="92" y="124" width="150" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="167" y="168" fill="#1e3a8a">硬盘</text>
    <rect x="658" y="124" width="150" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="733" y="168" fill="#991b1b">CPU</text>
    <rect x="92" y="270" width="150" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="167" y="314" fill="#4c1d95">内存</text>
    <rect x="658" y="270" width="150" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="733" y="314" fill="#92400e">软件/网络</text>
  </g>
  <g stroke="#64748b" stroke-width="5" stroke-linecap="round">
    <path d="M242 160 L382 198"/>
    <path d="M658 160 L518 198"/>
    <path d="M242 304 L382 242"/>
    <path d="M658 304 L518 242"/>
  </g>
</svg>
