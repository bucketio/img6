<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="erArrow" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="820" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">核心数据模型：六大实体关系</text>

  <!-- ===== 连接线（先画，置于实体下层） ===== -->
  <g stroke="#64748B" stroke-width="1.5" fill="none">
    <!-- 规则分类 1:N 质量规则 -->
    <line x1="250" y1="165" x2="386" y2="165" marker-end="url(#erArrow)"/>
    <!-- 质量规则 M:N 调度任务 -->
    <line x1="590" y1="165" x2="706" y2="165" marker-end="url(#erArrow)"/>
    <!-- 质量规则 1:N 检查结果（直线） -->
    <line x1="460" y1="270" x2="460" y2="336" marker-end="url(#erArrow)"/>
    <!-- 调度任务 1:N 检查结果（折线） -->
    <path d="M790,240 L790,300 L530,300 L530,336" marker-end="url(#erArrow)"/>
    <!-- 检查结果 1:N 异常项（折线） -->
    <path d="M440,510 L440,535 L240,535 L240,556" marker-end="url(#erArrow)"/>
    <!-- 异常项 1:1 工单 -->
    <line x1="340" y1="650" x2="616" y2="650" marker-end="url(#erArrow)"/>
  </g>

  <!-- 基数标注 -->
  <g font-size="13" font-weight="bold" fill="#1E3A5F" text-anchor="middle" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">
    <text x="320" y="158">1 : N</text>
    <text x="650" y="158">M : N</text>
    <text x="468" y="310" text-anchor="start">1 : N</text>
    <text x="660" y="293">1 : N</text>
    <text x="340" y="528">1 : N</text>
    <text x="478" y="643">1 : 1</text>
  </g>
  <g font-size="11.5" fill="#64748B" text-anchor="middle">
    <text x="320" y="181">一个分类包含多个规则</text>
    <text x="650" y="181">规则与任务多对多绑定</text>
    <text x="340" y="550">异常时拆分为异常项，正常时为 0 个</text>
    <text x="478" y="668">每个异常项发起一个工单</text>
  </g>

  <!-- ===== 实体：规则分类 ===== -->
  <g>
    <rect x="70" y="90" width="180" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M70,98 a8,8 0 0 1 8,-8 h164 a8,8 0 0 1 8,8 v22 h-180 Z" fill="#1E3A5F"/>
    <text x="160" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">规则分类</text>
    <text x="84" y="144" font-size="13" fill="#334155">分类编号</text>
    <text x="236" y="144" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="84" y="170" font-size="13" fill="#334155">分类名称</text>
    <text x="84" y="196" font-size="13" fill="#334155">所属质量维度</text>
    <text x="236" y="196" text-anchor="end" font-size="10.5" fill="#94A3B8">六大维度之一</text>
  </g>

  <!-- ===== 实体：质量规则（核心） ===== -->
  <g>
    <rect x="390" y="80" width="200" height="190" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <path d="M390,88 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v22 h-200 Z" fill="#EA580C"/>
    <text x="490" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">质量规则</text>
    <rect x="540" y="66" width="52" height="20" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
    <text x="566" y="80" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#EA580C">核心实体</text>
    <text x="404" y="134" font-size="13" fill="#334155">规则编号</text>
    <text x="576" y="134" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="404" y="160" font-size="13" fill="#2563EB">所属分类编号</text>
    <text x="576" y="160" text-anchor="end" font-size="10.5" fill="#2563EB">FK</text>
    <text x="404" y="186" font-size="13" fill="#334155">检查表达式（SQL）</text>
    <text x="404" y="212" font-size="13" fill="#334155">规则类型</text>
    <text x="576" y="212" text-anchor="end" font-size="10.5" fill="#94A3B8">直接/必选/互斥</text>
    <text x="404" y="238" font-size="13" fill="#334155">责任人表达式</text>
    <text x="576" y="238" text-anchor="end" font-size="10.5" fill="#94A3B8">动态指定</text>
  </g>

  <!-- ===== 实体：调度任务 ===== -->
  <g>
    <rect x="710" y="90" width="180" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M710,98 a8,8 0 0 1 8,-8 h164 a8,8 0 0 1 8,8 v22 h-180 Z" fill="#1E3A5F"/>
    <text x="800" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">调度任务</text>
    <text x="724" y="144" font-size="13" fill="#334155">任务编号</text>
    <text x="876" y="144" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="724" y="170" font-size="13" fill="#334155">Cron 表达式</text>
    <text x="724" y="196" font-size="13" fill="#334155">任务状态</text>
    <text x="876" y="196" text-anchor="end" font-size="10.5" fill="#94A3B8">启用/停用</text>
  </g>

  <!-- ===== 实体：检查结果 ===== -->
  <g>
    <rect x="390" y="340" width="200" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M390,348 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v22 h-200 Z" fill="#1E3A5F"/>
    <text x="490" y="363" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">检查结果</text>
    <text x="404" y="394" font-size="13" fill="#334155">结果编号</text>
    <text x="576" y="394" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="404" y="420" font-size="13" fill="#2563EB">任务编号</text>
    <text x="576" y="420" text-anchor="end" font-size="10.5" fill="#2563EB">FK</text>
    <text x="404" y="446" font-size="13" fill="#2563EB">规则编号</text>
    <text x="576" y="446" text-anchor="end" font-size="10.5" fill="#2563EB">FK</text>
    <text x="404" y="472" font-size="13" fill="#334155">检查状态</text>
    <text x="576" y="472" text-anchor="end" font-size="10.5" fill="#94A3B8">正常/异常</text>
    <text x="404" y="498" font-size="13" fill="#EA580C">执行耗时</text>
    <text x="576" y="498" text-anchor="end" font-size="10.5" fill="#94A3B8">性能优化依据</text>
  </g>

  <!-- ===== 实体：异常项 ===== -->
  <g>
    <rect x="140" y="560" width="200" height="180" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M140,568 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v22 h-200 Z" fill="#2563EB"/>
    <text x="240" y="583" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">异常项</text>
    <rect x="292" y="546" width="52" height="20" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="318" y="560" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2563EB">新增实体</text>
    <text x="154" y="614" font-size="13" fill="#334155">异常项编号</text>
    <text x="326" y="614" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="154" y="640" font-size="13" fill="#2563EB">结果编号</text>
    <text x="326" y="640" text-anchor="end" font-size="10.5" fill="#2563EB">FK</text>
    <text x="154" y="666" font-size="13" fill="#334155">异常对象标识</text>
    <text x="326" y="666" text-anchor="end" font-size="10.5" fill="#94A3B8">业务主键值</text>
    <text x="154" y="692" font-size="13" fill="#334155">异常值明细</text>
    <text x="154" y="718" font-size="13" fill="#334155">处理状态</text>
  </g>

  <!-- ===== 实体：质量问题工单 ===== -->
  <g>
    <rect x="620" y="560" width="200" height="190" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <path d="M620,568 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v22 h-200 Z" fill="#1E3A5F"/>
    <text x="720" y="583" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">质量问题工单</text>
    <text x="634" y="614" font-size="13" fill="#334155">工单编号</text>
    <text x="806" y="614" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">PK</text>
    <text x="634" y="640" font-size="13" fill="#2563EB">异常项编号</text>
    <text x="806" y="640" text-anchor="end" font-size="10.5" fill="#2563EB">FK</text>
    <text x="634" y="666" font-size="13" fill="#334155">是否误报</text>
    <text x="634" y="692" font-size="13" fill="#334155">根因分析</text>
    <text x="634" y="718" font-size="13" fill="#334155">解决措施</text>
    <text x="634" y="744" font-size="13" fill="#334155">原因归类 / 状态</text>
  </g>

  <!-- 底部注释 -->
  <g font-size="12.5" fill="#64748B" text-anchor="middle">
    <text x="480" y="784">检查结果同时归属一个调度任务与一个质量规则（联合来源）；检查异常时拆分为异常项（正常时为 0 个），每个异常项发起一个质量问题工单，形成处理闭环</text>
    <text x="480" y="806" fill="#94A3B8">PK = 主键    FK = 外键</text>
  </g>
</svg>
